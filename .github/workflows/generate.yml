name: Write the next week of blog posts
# Every Monday, Claude drafts posts for the coming week from content/topics.json.
# They are dated in the future, so you have a window to read, edit or delete before they go live.
# Needs repository secret ANTHROPIC_API_KEY.
on:
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:
    inputs:
      posts_per_day: { description: 'Posts per day (1-3)', default: '2' }
      days_ahead: { description: 'Days to fill', default: '7' }
permissions:
  contents: write
concurrency: blog-generate
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Write posts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POSTS_PER_DAY: ${{ inputs.posts_per_day || '2' }}
          DAYS_AHEAD: ${{ inputs.days_ahead || '7' }}
        run: node scripts/generate-posts.mjs
      - run: node scripts/build-blog.mjs --check
      - name: Commit the queue
        run: |
          git config user.name "moonberry-bot"
          git config user.email "moonberry-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to add"; exit 0; fi
          git commit -m "Queue blog posts"
          git pull --rebase origin main
          git push origin HEAD:main
